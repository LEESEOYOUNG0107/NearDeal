spring.application.name=carrot
server.port=8080
spring.datasource.driver-class-name=oracle.jdbc.OracleDriver
spring.datasource.url=jdbc:oracle:thin:@localhost:1521:xe
spring.datasource.username=system
spring.datasource.password=${DB_PASSWORD}

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true

# 키가 비어 있으면 앱이 아예 못 뜨므로 더미 기본값 사용. 키 없이 AI 호출하면 502로 실패
spring.ai.google.genai.api-key=${GEMINI_API_KEY:no-key-set}
spring.ai.google.genai.chat.model=gemini-3.8-flash
spring.ai.google.genai.chat.max-output-tokens=1000
spring.ai.google.genai.chat.temperature=0.3

# JWT: 비밀키는 환경변수 JWT_SECRET(32자 이상)로만 넣는다. 비어 있으면 서버 시작 때 무작위 키를 만든다(재시작하면 기존 토큰 무효)
app.jwt.secret=${JWT_SECRET:}
app.jwt.expiration-minutes=60

spring.thymeleaf.cache=false
mybatis.mapper-locations=classpath*:mybatis/mapper/**/*.xml
#?? ??? ?? xml ??? ??
# 상품 사진 업로드: 파일은 이 폴더에 저장(기본: 실행 위치의 uploads/). 한 장 5MB, 한 번에 최대 10장
app.upload-dir=${UPLOAD_DIR:uploads}
spring.servlet.multipart.max-file-size=5MB
spring.servlet.multipart.max-request-size=55MB

# 프로젝트 루트의 .env 파일(KEY=값 형식)을 설정으로 읽는다. 파일이 없어도 앱은 뜬다. 키는 여기가 아니라 .env 에 둔다
spring.config.import=optional:file:.env[.properties]

# Swagger: REST API(/api/**)만 문서에 넣는다(Thymeleaf 화면용 경로 제외)
springdoc.paths-to-match=/api/**
springdoc.swagger-ui.tags-sorter=alpha

# 오류 응답에 스택트레이스/예외 메시지를 싣지 않는다(Boot 4 는 spring.web.error.*. DevTools 가 켜져 있으면 기본값이 always 라서 명시한다). REST 오류는 GlobalExceptionHandler 가 만든다
spring.web.error.include-stacktrace=never
spring.web.error.include-message=never
spring.web.error.include-binding-errors=never
# Swagger 는 운영에서 SWAGGER_ENABLED=false 로 끈다
springdoc.api-docs.enabled=${SWAGGER_ENABLED:true}
springdoc.swagger-ui.enabled=${SWAGGER_ENABLED:true}

# AI(Gemini)가 과부하(503)일 때 오래 붙잡혀 있지 않도록 재시도를 줄인다(기본은 10번, 간격 최대 3분)
spring.ai.retry.max-attempts=2
spring.ai.retry.backoff.initial-interval=1000ms
spring.ai.retry.backoff.max-interval=3000ms

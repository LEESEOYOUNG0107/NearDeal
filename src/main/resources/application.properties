spring.application.name=carrot
server.port=8080
spring.datasource.driver-class-name=oracle.jdbc.OracleDriver
spring.datasource.url=jdbc:oracle:thin:@localhost:1521:xe
spring.datasource.username=system
spring.datasource.password=${DB_PASSWORD}

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true

# 키가 비어 있으면 앱이 아예 못 뜨므로 더미 기본값 사용. 키 없이 AI 호출하면 502로 실패
spring.ai.google.genai.api-key=${GEMINI_API_KEY:no-key-set}
spring.ai.google.genai.chat.model=gemini-3.8-flash
spring.ai.google.genai.chat.max-output-tokens=1000
spring.ai.google.genai.chat.temperature=0.3

# JWT: 비밀키는 환경변수 JWT_SECRET(32자 이상)로만 넣는다. 비어 있으면 서버 시작 때 무작위 키를 만든다(재시작하면 기존 토큰 무효)
app.jwt.secret=${JWT_SECRET:}
app.jwt.expiration-minutes=60

spring.thymeleaf.cache=false
mybatis.mapper-locations=classpath*:mybatis/mapper/**/*.xml
#?? ??? ?? xml ??? ??
# 상품 사진 업로드: 파일은 이 폴더에 저장(기본: 실행 위치의 uploads/). 한 장 5MB, 한 번에 최대 10장
app.upload-dir=${UPLOAD_DIR:uploads}
spring.servlet.multipart.max-file-size=5MB
spring.servlet.multipart.max-request-size=55MB

# 프로젝트 루트의 .env 파일(KEY=값 형식)을 설정으로 읽는다. 파일이 없어도 앱은 뜬다. 키는 여기가 아니라 .env 에 둔다
spring.config.import=optional:file:.env[.properties]

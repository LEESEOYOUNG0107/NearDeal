<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: head('NearDeal')}"></head>
<body>
<div class="app">
    <header class="topbar">
        <a class="region" th:href="@{/my/neighborhood}">
            <svg class="icon" viewBox="0 0 24 24"><path d="M12 21s7-6 7-11a7 7 0 0 0-14 0c0 5 7 11 7 11z"/><circle cx="12" cy="10" r="2.5"/></svg>
            <span th:text="${activeRegion != null} ? ${activeRegion} : '전체 동네'">전체 동네</span>
            <svg class="icon sm" viewBox="0 0 24 24"><path d="M6 9l6 6 6-6"/></svg>
        </a>
        <a class="icon-btn spacer" th:href="@{/notifications}" aria-label="알림">
            <svg class="icon" viewBox="0 0 24 24"><path d="M6 17V11a6 6 0 0 1 12 0v6l2 2H4zM10 21h4"/></svg>
        </a>
    </header>

    <!-- 검색창을 누르면 검색 화면으로 이동 -->
    <a class="search" th:href="@{/search}" role="search">
        <svg class="icon" viewBox="0 0 24 24"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg>
        <span th:text="${activeRegion != null} ? ${activeRegion + '에서 검색'} : '어떤 물건을 찾으세요?'">어떤 물건을 찾으세요?</span>
    </a>

    <nav class="scroller" aria-label="카테고리">
        <a class="cat" th:href="@{/}" th:classappend="${selected == null} ? 'on'"><i>🏠</i>전체</a>
        <a class="cat" th:each="c : ${categories}" th:href="@{/(category=${c})}"
           th:classappend="${selected == c} ? 'on'">
            <i th:text="${categoryIcons[c.name()]}">📦</i><span th:text="${categoryLabels[c.name()]}">카테고리</span>
        </a>
    </nav>

    <section class="section" th:if="${!popular.isEmpty()}">
        <h2>우리 동네 인기 상품</h2>
        <div class="rail">
            <th:block th:each="p : ${popular}"><a th:replace="~{fragments/layout :: productCard(${p})}"></a></th:block>
        </div>
    </section>

    <section class="section">
        <h2>방금 올라온 상품</h2>
        <div class="grid" th:if="${!latest.isEmpty()}">
            <th:block th:each="p : ${latest}"><a th:replace="~{fragments/layout :: productCard(${p})}"></a></th:block>
        </div>
        <p class="empty" th:if="${latest.isEmpty()}">아직 올라온 상품이 없어요.<br>첫 번째 물건을 올려 보세요!</p>
    </section>

    <a th:replace="~{fragments/layout :: fab}"></a>
    <nav th:replace="~{fragments/layout :: bottomNav('home')}"></nav>
</div>
</body>
</html>

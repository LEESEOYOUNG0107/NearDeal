<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: head('로그인')}"></head>
<body>
<main class="auth">
    <div class="auth-brand">
        <span class="logo-mark" aria-hidden="true">
            <svg class="icon" viewBox="0 0 24 24"><path d="M12 21s7-6 7-11a7 7 0 0 0-14 0c0 5 7 11 7 11z"/><circle cx="12" cy="10" r="2.5"/></svg>
        </span>
        <h1>NearDeal</h1>
        <p>우리 동네에서 가까이, 믿고 거래해요</p>
    </div>

    <form class="auth-form" th:action="@{/login}" method="post">
        <input type="hidden" name="next" th:value="${next}">
        <p class="form-error" role="alert" th:if="${error}" th:text="${error}">오류</p>

        <div class="field">
            <label for="email">이메일</label>
            <input class="input" id="email" name="email" type="email" autocomplete="email" th:value="${email}" placeholder="example@email.com" required autofocus>
        </div>
        <div class="field">
            <label for="password">비밀번호</label>
            <input class="input" id="password" name="password" type="password" autocomplete="current-password" placeholder="비밀번호" required>
        </div>
        <button type="submit" class="btn primary block">로그인</button>
    </form>

    <p class="auth-switch">아직 계정이 없나요? <a th:href="@{/signup}">회원가입</a></p>
</main>
</body>
</html>

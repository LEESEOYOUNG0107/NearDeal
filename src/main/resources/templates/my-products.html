<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: head('판매 상품')}"></head>
<body>
<div class="app">
    <header th:replace="~{fragments/layout :: appBar('판매 상품', '/my')}"></header>
    <section class="section">
        <div class="grid" th:if="${!latest.isEmpty()}">
            <th:block th:each="p : ${latest}"><a th:replace="~{fragments/layout :: productCard(${p})}"></a></th:block>
        </div>
        <p class="empty" th:if="${latest.isEmpty()}">등록한 상품이 없어요.</p>
    </section>
    <a th:replace="~{fragments/layout :: fab}"></a>
    <nav th:replace="~{fragments/layout :: bottomNav('my')}"></nav>
</div>
</body>
</html>

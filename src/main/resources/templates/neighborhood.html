<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: head('내 동네 설정')}"></head>
<body>
<div class="app narrow">
    <header th:replace="~{fragments/layout :: appBar('내 동네 설정', '/my')}"></header>

    <!-- 반경을 표현한 지도 자리: 동그란 링으로 "가까운 동네"를 보여 준다 -->
    <div class="map" aria-hidden="true">
        <span class="ring r3"></span><span class="ring r2"></span><span class="ring r1"></span>
        <span class="pin">
            <svg class="icon" viewBox="0 0 24 24"><path d="M12 21s7-6 7-11a7 7 0 0 0-14 0c0 5 7 11 7 11z"/><circle cx="12" cy="10" r="2.5"/></svg>
        </span>
        <span class="map-label" th:text="${mine.isEmpty()} ? '동네를 설정해 주세요' : ${mine.get(0)}">동네</span>
    </div>

    <section class="section">
        <h2>내 동네 <small class="hint" th:text="${mine.size() + '/2'}">0/2</small></h2>
        <p class="toast" role="alert" th:if="${full}">동네는 최대 2개까지 추가할 수 있어요. 하나를 삭제한 뒤 추가해 주세요.</p>

        <ul class="regions" th:if="${!mine.isEmpty()}">
            <li th:each="r, st : ${mine}" class="region-item" th:classappend="${st.first} ? 'active'">
                <span class="region-name">
                    <svg class="icon sm" viewBox="0 0 24 24"><path d="M12 21s7-6 7-11a7 7 0 0 0-14 0c0 5 7 11 7 11z"/><circle cx="12" cy="10" r="2.5"/></svg>
                    <b th:text="${r}">성수동</b>
                    <span class="status sale" th:if="${st.first}">현재 동네</span>
                </span>
                <span class="region-actions">
                    <form th:if="${!st.first}" th:action="@{/my/neighborhood/activate}" method="post">
                        <input type="hidden" name="region" th:value="${r}">
                        <button type="submit" class="chip">이 동네로 변경</button>
                    </form>
                    <form th:action="@{/my/neighborhood/remove}" method="post">
                        <input type="hidden" name="region" th:value="${r}">
                        <button type="submit" class="text-btn" th:attr="aria-label=${r + ' 삭제'}">삭제</button>
                    </form>
                </span>
            </li>
        </ul>
        <p class="hint" th:if="${mine.isEmpty()}">동네를 추가하면 홈에서 그 동네 상품만 모아 볼 수 있어요.</p>
    </section>

    <section class="section">
        <h2>동네 검색</h2>
        <form class="search" th:action="@{/my/neighborhood}" method="get" role="search">
            <svg class="icon" viewBox="0 0 24 24"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg>
            <input type="search" name="q" th:value="${q}" placeholder="동네 이름(동·읍·면)으로 검색" aria-label="동네 검색">
        </form>

        <ul class="regions">
            <li class="region-item" th:each="r : ${results}">
                <span class="region-name" th:text="${r}">연남동</span>
                <form th:action="@{/my/neighborhood/add}" method="post">
                    <input type="hidden" name="region" th:value="${r}">
                    <button type="submit" class="chip" th:disabled="${mine.size() >= 2}">+ 추가</button>
                </form>
            </li>
            <!-- 목록에 없는 동네는 입력한 이름 그대로 추가 -->
            <li class="region-item" th:if="${canAdd}">
                <span class="region-name"><b th:text="${q}">입력한 동네</b> 직접 추가</span>
                <form th:action="@{/my/neighborhood/add}" method="post">
                    <input type="hidden" name="region" th:value="${q}">
                    <button type="submit" class="chip" th:disabled="${mine.size() >= 2}">+ 추가</button>
                </form>
            </li>
        </ul>
        <p class="empty" th:if="${results.isEmpty() and !canAdd}">검색 결과가 없어요.</p>
    </section>

    <nav th:replace="~{fragments/layout :: bottomNav('my')}"></nav>
</div>
</body>
</html>
